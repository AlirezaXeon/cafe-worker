<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>پنل مدیریت — کافه روشن</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #f0ede8;
      --surface: #fff;
      --border: #e2ddd6;
      --text: #1c1b18;
      --muted: #88847f;
      --accent: #c47c3a;
      --accent-light: #fdf3ea;
      --accent-dark: #9e5f24;
      --success: #2e9e60;
      --success-light: #edfaf3;
      --danger: #c0392b;
      --danger-light: #fdf0ee;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 2px 16px rgba(0, 0, 0, .07);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, .14);
    }

    * {
      box-sizing: border-box
    }

    body {
      font-family: system-ui, 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.65
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px
    }

    /* Login */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #fdf6ef, #f0e9e0)
    }

    .login-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 2.75rem 2.25rem;
      width: 100%;
      max-width: 370px;
      box-shadow: var(--shadow-lg);
      text-align: center
    }

    .login-logo {
      font-size: 2.5rem;
      margin-bottom: .5rem
    }

    .login-card h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: .2rem
    }

    .login-card p {
      color: var(--muted);
      font-size: .85rem;
      margin-bottom: 2rem
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      padding: .6rem 1.25rem;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: .88rem;
      font-weight: 600;
      transition: all .18s;
      font-family: inherit;
      white-space: nowrap
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed
    }

    .btn-primary {
      background: var(--accent);
      color: #fff
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-dark);
      box-shadow: 0 4px 12px rgba(196, 124, 58, .3)
    }

    .btn-block {
      width: 100%
    }

    .btn-sm {
      padding: .38rem .85rem;
      font-size: .8rem;
      border-radius: 6px
    }

    .btn-ghost {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text)
    }

    .btn-ghost:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light)
    }

    .btn-danger {
      background: var(--danger-light);
      color: var(--danger);
      border: 1.5px solid #f0c0bb
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger)
    }

    /* Form */
    .field {
      margin-bottom: .9rem
    }

    .field label {
      display: block;
      font-size: .78rem;
      color: var(--muted);
      margin-bottom: .35rem;
      font-weight: 600;
      letter-spacing: .02em
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: .65rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: .9rem;
      outline: none;
      font-family: inherit;
      background: var(--surface);
      color: var(--text);
      transition: .18s
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(196, 124, 58, .1)
    }

    .field textarea {
      resize: vertical;
      min-height: 70px
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .75rem
    }

    .err-msg {
      color: var(--danger);
      font-size: .8rem;
      margin-top: .4rem;
      min-height: 1.1rem
    }

    .hint {
      font-size: .75rem;
      color: var(--muted);
      margin-top: .25rem
    }

    /* Layout */
    #app {
      display: none;
      min-height: 100vh
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: .9rem 1.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 1px 0 var(--border)
    }

    .logo {
      display: flex;
      align-items: center;
      gap: .6rem;
      font-weight: 700;
      font-size: 1rem
    }

    .logo-sub {
      color: var(--muted);
      font-size: .72rem;
      font-weight: 400;
      display: block
    }

    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: .5rem 1.75rem;
      display: flex;
      gap: .25rem
    }

    .nav-btn {
      padding: .45rem 1.1rem;
      border: none;
      background: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: .88rem;
      color: var(--muted);
      font-weight: 500;
      transition: .15s;
      font-family: inherit
    }

    .nav-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(196, 124, 58, .25)
    }

    .nav-btn:not(.active):hover {
      background: var(--bg);
      color: var(--text)
    }

    main {
      padding: 1.5rem 1.75rem;
      max-width: 1080px;
      margin: 0 auto
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 1.75rem
    }

    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.25rem 1.4rem;
      box-shadow: var(--shadow);
      border-right: 4px solid var(--accent)
    }

    .stat-card.green {
      border-color: var(--success)
    }

    .stat-card.gray {
      border-color: var(--muted)
    }

    .stat-card .val {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1
    }

    .stat-card.green .val {
      color: var(--success)
    }

    .stat-card.gray .val {
      color: var(--muted)
    }

    .stat-card .lbl {
      color: var(--muted);
      font-size: .8rem;
      margin-top: .4rem
    }

    .stat-card.red {
      border-color: var(--danger)
    }

    .stat-card.red .val {
      color: var(--danger)
    }

    .stat-icon {
      font-size: 1.3rem;
      margin-bottom: .5rem;
      opacity: .85
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: .75rem;
      margin-bottom: 1.75rem
    }

    .quick-action {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      display: flex;
      align-items: center;
      gap: .7rem;
      cursor: pointer;
      transition: box-shadow .15s, transform .15s;
      text-decoration: none;
      color: var(--text)
    }

    .quick-action:hover {
      box-shadow: var(--shadow);
      transform: translateY(-2px)
    }

    .quick-action .qa-icon {
      font-size: 1.4rem;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-light);
      border-radius: var(--radius-sm);
      flex-shrink: 0
    }

    .quick-action .qa-label {
      font-weight: 600;
      font-size: .88rem
    }

    .dash-section-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: .9rem
    }

    .cat-breakdown-item {
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: .6rem 0
    }

    .cat-breakdown-item .cb-label {
      width: 110px;
      flex-shrink: 0;
      font-size: .83rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .cat-breakdown-item .cb-bar-track {
      flex: 1;
      height: 8px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden
    }

    .cat-breakdown-item .cb-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 4px
    }

    .cat-breakdown-item .cb-count {
      width: 30px;
      flex-shrink: 0;
      text-align: left;
      font-size: .8rem;
      color: var(--muted)
    }

    /* Card */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border)
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.4rem;
      border-bottom: 1px solid var(--border)
    }

    .card-header h2 {
      font-size: .95rem;
      font-weight: 700
    }

    .card-toolbar {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .75rem 1.4rem;
      border-bottom: 1px solid var(--border);
      background: #fafaf8
    }

    .search-input {
      flex: 1;
      padding: .5rem .9rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: .85rem;
      outline: none;
      font-family: inherit;
      transition: .18s
    }

    .search-input:focus {
      border-color: var(--accent)
    }

    /* Table */
    .table-wrap {
      overflow-x: auto
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 480px
    }

    th {
      background: #fafaf8;
      padding: .65rem 1.2rem;
      text-align: right;
      font-size: .75rem;
      color: var(--muted);
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      letter-spacing: .03em
    }

    td {
      padding: .8rem 1.2rem;
      border-top: 1px solid #f3f0ec;
      vertical-align: middle;
      font-size: .875rem
    }

    tbody tr:hover td {
      background: #fdf9f5
    }

    .prod-name {
      font-weight: 600
    }

    .prod-note {
      color: var(--muted);
      font-size: .77rem;
      margin-top: .15rem
    }

    .price-orig {
      color: var(--muted);
      text-decoration: line-through;
      font-size: .77rem;
      display: block
    }

    .price-main {
      font-weight: 600
    }

    .disc-badge {
      background: #fff3e0;
      color: #e65100;
      border: 1px solid #ffcc80;
      padding: .15rem .45rem;
      border-radius: 20px;
      font-size: .72rem;
      font-weight: 700;
      margin-right: .3rem
    }

    .actions {
      display: flex;
      gap: .4rem
    }

    .empty {
      text-align: center;
      padding: 3rem;
      color: var(--muted)
    }

    .empty-icon {
      font-size: 2rem;
      margin-bottom: .5rem
    }

    /* Orders */
    .pending-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 10px;
      background: var(--danger);
      color: #fff;
      font-size: .7rem;
      font-weight: 700;
      margin-right: .3rem;
    }

    .order-list {
      display: flex;
      flex-direction: column;
      gap: .7rem;
      padding: 1.1rem 1.25rem;
    }

    .order-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1rem 1.1rem;
      background: var(--bg);
    }

    .order-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .6rem;
      margin-bottom: .6rem;
      flex-wrap: wrap;
    }

    .order-table-no {
      font-weight: 700;
      font-size: .95rem;
    }

    .order-time {
      color: var(--muted);
      font-size: .78rem;
    }

    .order-status {
      padding: .18rem .6rem;
      border-radius: 20px;
      font-size: .74rem;
      font-weight: 700;
    }

    .order-status.pending {
      background: rgba(196, 124, 58, .14);
      color: var(--accent);
    }

    .order-status.confirmed {
      background: var(--success-light);
      color: var(--success);
    }

    .order-status.rejected {
      background: var(--danger-light);
      color: var(--danger);
    }

    .order-items {
      display: flex;
      flex-direction: column;
      gap: .25rem;
      margin-bottom: .7rem;
      font-size: .85rem;
    }

    .order-item-row {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
    }

    .order-item-row span:first-child {
      color: var(--text);
    }

    .order-card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .6rem;
      padding-top: .6rem;
      border-top: 1px solid var(--border);
    }

    .order-total {
      font-weight: 700;
      font-size: .92rem;
    }

    .img-preview {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border)
    }

    .img-placeholder {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted)
    }

    /* Toggle */
    .toggle {
      width: 42px;
      height: 24px;
      background: var(--border);
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      transition: .2s;
      border: none;
      flex-shrink: 0
    }

    .toggle.on {
      background: var(--success)
    }

    .toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      right: 3px;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      transition: .2s;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .2)
    }

    .toggle.on::after {
      transform: translateX(-18px)
    }

    /* Upload */
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius-sm);
      padding: 1.1rem;
      text-align: center;
      cursor: pointer;
      transition: .2s;
      position: relative;
      background: #fafaf8
    }

    .upload-area:hover {
      border-color: var(--accent);
      background: var(--accent-light)
    }

    .upload-area input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%
    }

    .upload-area p {
      font-size: .82rem;
      color: var(--muted);
      margin-top: .2rem
    }

    .upload-preview {
      margin-top: .5rem;
      display: none;
      text-align: center
    }

    .upload-preview img {
      max-height: 90px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border)
    }

    .upload-status {
      font-size: .78rem;
      color: var(--muted);
      margin-top: .25rem
    }

    /* Modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      backdrop-filter: blur(2px)
    }

    .overlay.open {
      display: flex
    }

    .modal {
      background: var(--surface);
      border-radius: 18px;
      width: 100%;
      max-width: 460px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 1.75rem;
      box-shadow: var(--shadow-lg)
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem
    }

    .modal-header h3 {
      font-size: 1rem;
      font-weight: 700
    }

    .modal-close {
      background: var(--bg);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: .95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: .15s
    }

    .modal-close:hover {
      background: var(--border)
    }

    .modal-footer {
      display: flex;
      gap: .6rem;
      justify-content: flex-end;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border)
    }

    .section-sep {
      font-size: .7rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: .06em;
      margin: .75rem 0 .5rem;
      display: block;
      text-transform: uppercase
    }

    /* Cat grid */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: .75rem;
      padding: 1.25rem
    }

    .cat-item {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .85rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      background: var(--bg)
    }

    .cat-item .cat-name {
      font-weight: 600;
      font-size: .88rem;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .cat-item .cat-count {
      color: var(--muted);
      font-size: .75rem
    }

    /* Discount preview */
    .disc-preview {
      background: var(--accent-light);
      border: 1px solid #f5d5b0;
      border-radius: var(--radius-sm);
      padding: .6rem .9rem;
      font-size: .83rem;
      margin-top: .4rem;
      display: none
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1c1b18;
      color: #fff;
      padding: .6rem 1.25rem;
      border-radius: 30px;
      font-size: .85rem;
      z-index: 999;
      opacity: 0;
      transition: all .28s;
      pointer-events: none;
      white-space: nowrap
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    #toast.err {
      background: var(--danger)
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, .35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @media(max-width:600px) {
      main {
        padding: 1rem
      }

      header {
        padding-left: 1rem;
        padding-right: 1rem
      }

      nav {
        padding-left: 1rem;
        padding-right: 1rem;
        overflow-x: auto;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
      }

      .nav-btn {
        flex-shrink: 0;
      }

      .row-2 {
        grid-template-columns: 1fr
      }
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #qr-print-sheet, #qr-print-sheet * {
        visibility: visible;
      }
      #qr-print-sheet {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: #fff !important;
        color: #000 !important;
        display: block !important;
        padding: 1cm;
      }
      .no-print {
        display: none !important;
      }
      .print-card {
        page-break-inside: avoid;
        border: 2px dashed #666 !important;
        background: #fff !important;
        color: #000 !important;
        padding: 15px;
        margin-bottom: 20px;
        text-align: center;
        border-radius: 8px;
      }
    }
  </style>
</head>

<body>

  <!-- Login -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">☕</div>
      <h1>کافه روشن</h1>
      <p>پنل مدیریت</p>
      <div class="field">
        <label>رمز عبور</label>
        <input type="password" id="pw" placeholder="••••••••" />
      </div>
      <button class="btn btn-primary btn-block" id="login-btn">ورود به پنل</button>
      <div class="err-msg" id="login-err"></div>
    </div>
  </div>

  <!-- App -->
  <div id="app">
    <header style="display:flex;justify-content:space-between;align-items:center;">
      <div class="logo">
        <span style="font-size:1.4rem">☕</span>
        <div>
          <div>کافه روشن</div><span class="logo-sub">پنل مدیریت</span>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" id="logout-btn" title="خروج از حساب">🚪 خروج</button>
    </header>
    <nav>
      <button class="nav-btn active" data-tab="dashboard">🏠 داشبورد</button>
      <button class="nav-btn" data-tab="orders">🧾 سفارش‌ها <span id="pending-badge"
          class="pending-badge" style="display:none"></span></button>
      <button class="nav-btn" data-tab="products">🍽 محصولات</button>
      <button class="nav-btn" data-tab="categories">📂 دسته‌بندی‌ها</button>
      <button class="nav-btn" data-tab="qr">📱 QR میزها</button>
      <button class="nav-btn" data-tab="site">🖼 تصاویر و تنظیمات</button>
    </nav>
    <main id="main-content"></main>
  </div>

  <!-- Product Modal -->
  <div class="overlay" id="product-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">محصول جدید</h3>
        <button class="modal-close" data-close-modal="product-modal">✕</button>
      </div>

      <span class="section-sep">اطلاعات اصلی</span>
      <div class="field"><label>نام محصول *</label><input id="p-name" placeholder="مثلاً: لاته کارامل" /></div>
      <div class="field">
        <label>دسته‌بندی *</label>
        <select id="p-cat">
          <option value="">انتخاب کنید...</option>
        </select>
      </div>
      <div class="row-2">
        <div class="field">
          <label>قیمت (تومان) *</label>
          <input id="p-price" type="number" placeholder="85000" />
        </div>
        <div class="field">
          <label>تخفیف (%)</label>
          <input id="p-discount" type="number" min="0" max="99" placeholder="0" />
          <div class="disc-preview" id="disc-preview"></div>
        </div>
      </div>
      <div class="field"><label>یادداشت / توضیحات</label><textarea id="p-note"
          placeholder="مواد تشکیل‌دهنده، توضیح کوتاه..."></textarea></div>

      <span class="section-sep">تصویر</span>
      <div class="field">
        <div class="upload-area">
          <input type="file" id="p-file-input" accept="image/*" />
          <div style="font-size:1.4rem">📷</div>
          <p>کلیک کنید یا فایل را اینجا بکشید</p>
          <p style="font-size:.73rem">JPG · PNG · WEBP · قبل از آپلود خودکار فشرده میشه (سقف نهایی 2MB)</p>
        </div>
        <div class="upload-preview" id="prod-upload-preview">
          <img id="prod-preview-img" src="" alt="" />
          <div class="upload-status" id="prod-upload-status"></div>
        </div>
        <input id="p-img" type="hidden" />
      </div>

      <span class="section-sep">وضعیت</span>
      <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.9rem">
        <button class="toggle on" id="p-avail"></button>
        <span id="p-avail-lbl">موجود</span>
      </div>

      <div class="err-msg" id="prod-err"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-close-modal="product-modal">انصراف</button>
        <button class="btn btn-primary" id="save-prod-btn">ذخیره محصول</button>
      </div>
    </div>
  </div>

  <!-- Category Modal -->
  <div class="overlay" id="cat-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="cat-modal-title">دسته‌بندی جدید</h3>
        <button class="modal-close" data-close-modal="cat-modal">✕</button>
      </div>
      <div class="field"><label>نام دسته‌بندی *</label><input id="c-label" placeholder="مثلاً: قهوه سرد" /></div>
      <div class="field">
        <label>تصویر دسته‌بندی</label>
        <div class="upload-area">
          <input type="file" id="c-file-input" accept="image/*" />
          <div style="font-size:1.4rem">🖼</div>
          <p>کلیک کنید یا فایل را اینجا بکشید</p>
        </div>
        <div class="upload-preview" id="cat-upload-preview">
          <img id="cat-preview-img" src="" alt="" />
          <div class="upload-status" id="cat-upload-status"></div>
        </div>
        <input id="c-img" type="hidden" />
      </div>
      <div class="err-msg" id="cat-err"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-close-modal="cat-modal">انصراف</button>
        <button class="btn btn-primary" id="save-cat-btn">ذخیره</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/admin/admin.js"></script>
</body>

</html>
